## Hetzner installimage config for AX102-U (2x 1.92TB NVMe)
## Usage: paste this into the editor when `installimage` opens.
##
## Layout: software RAID 1 (mirror) across both NVMe drives.
## Usable space after RAID 1: ~1.92 TB.
##
##   /boot          1 GB     (ext4, outside LVM)
##   swap          16 GB
##   /             80 GB     (OS + packages)
##   /var/lib/docker  300 GB  (images, containers, volumes)
##   /data        rest       (~1.5 TB: OT data, ZIM workspace, model cache)

DRIVE1 /dev/nvme0n1
DRIVE2 /dev/nvme1n1

SWRAID 1
SWRAIDLEVEL 1

BOOTLOADER grub

HOSTNAME hetzner-ax102

IMAGE /root/.oldroot/nfs/images/Ubuntu-2404-noble-amd64-base.tar.gz

PART /boot ext4 1024M
PART lvm   vg0  all

LV vg0 swap swap    16G
LV vg0 root /       80G
LV vg0 docker /var/lib/docker 300G
LV vg0 data /data   all
